<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🖕</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖕</text></svg>">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000; /* change this color to match your image */
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  img {
    max-width: 90vw;
    max-height: 90vh;
    max-height: 90dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  img, .fallback {
    animation: wiggle 1.6s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  .fallback {
    font-size: min(60vw, 60vh);
    line-height: 1;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    img, .fallback { animation: none; }
  }
</style>
</head>
<body>
  <img src="finger.jpg" alt="" onerror="this.outerHTML='<div class=fallback>🖕</div>'">
</body>
</html>
